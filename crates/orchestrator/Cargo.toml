[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sqlite-memory = { path = "../sqlite-memory" }
embedding = { path = "../embedding" }
tools = { path = "../tools" }

tempfile = "3"
indexer = { path = "../indexer" }
