[package]
name = "assistant-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "assistant-tui"
path = "src/main.rs"

[dependencies]
assistant-client = { path = "../assistant-client" }
assistant-protocol = { path = "../assistant-protocol" }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
