[package]
name = "assistant-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "assistant-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
orchestrator = { path = "../orchestrator" }
sqlite-memory = { path = "../sqlite-memory" }
serde_json = "1"
