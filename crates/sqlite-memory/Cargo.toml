[package]
name = "sqlite-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
indexer = { path = "../indexer" }
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1.9"
zerocopy = "0.7"
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
